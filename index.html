<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paris RP V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        .background {
            width: 100%;
            height: 100%;
            background-image: url("loading.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .version {
            position: absolute;
            right: 25px;
            bottom: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #008cff;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="version">PARIS RP V2</div>
</body>
</html>
